<svg xmlns="http://www.w3.org/2000/svg" width="560" height="120" viewBox="0 0 560 120" role="img" aria-labelledby="title">
  <title id="title">Zero-Point Security</title>
  <style>
    :root {
      --accent: #81d9ef; --icon: #173541; --surface: #101e27;
      --ink: #f5f6f0;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --accent: #126479; --icon: #d9f1f5; --surface: #eff9fc;
        --ink: #1a2524;
      }
    }
  </style>
  <defs>
    <linearGradient id="wash" x2="100%" y2="0%">
      <stop stop-color="var(--icon)"/>
      <stop offset=".55" stop-color="var(--surface)"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="558" height="118" rx="17" fill="url(#wash)" stroke="var(--accent)" stroke-opacity=".44" stroke-width="2"/>
  <rect x="22" y="22" width="76" height="76" rx="14" fill="var(--icon)" stroke="var(--accent)" stroke-opacity=".45"/>
  <g fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="36" y="40" width="48" height="40" rx="6"/>
      <path d="M45 52l9 8-9 8m16 0h13"/>
  </g>
  <text x="120" y="48" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="1.4" fill="var(--accent)">ADVERSARY EMULATION</text>
  <text x="117" y="87" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" letter-spacing="-1" fill="var(--ink)">Zero-Point Security</text>
  <g fill="var(--accent)" opacity=".5">
    <circle cx="510" cy="30" r="2.5"/>
    <circle cx="521" cy="30" r="2.5"/>
    <circle cx="532" cy="30" r="2.5"/>
  </g>
</svg>
