name: Update contribution snake

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-snake.yml
      - generate_contribution_snake.py

permissions: {}

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Render public GitHub activity
        run: python3 generate_contribution_snake.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish only if the image changed
        run: |
          git add -- contribution-snake.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh contribution snake'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
