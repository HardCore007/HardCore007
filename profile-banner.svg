<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="432" viewBox="0 0 1120 432" role="img" aria-labelledby="title desc">
  <title id="title">Umar Mushtaq</title>
  <desc id="desc">Security Researcher and Red Team Operator. A radar sweeps as a terminal types, erases, and retypes security assessment phrases.</desc>

  <style>
    :root {
      --surface: #0b1513;
      --chrome: #101e19;
      --field: #17392d;
      --border: #355448;
      --ink: #f1f6ed;
      --muted: #a5bfb0;
      --accent: #b4fa83;
      --echo: #69dbc4;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --surface: #f4f9f2;
        --chrome: #e6f0e6;
        --field: #d1e9d9;
        --border: #86a492;
        --ink: #102b23;
        --muted: #3d5d50;
        --accent: #2d681f;
        --echo: #0d7766;
      }
    }

    .mono { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; }
    .sweep { transform-origin: 912px 198px; transform: rotate(-35deg); }
    .echo { transform-box: fill-box; transform-origin: center; opacity: .44; }
    .typing { display: none; }
    .phrase-scope { --letters: 22; --advance: 286px; --delay: 0s; }
    .phrase-trace { --letters: 21; --advance: 273px; --delay: -10s; }
    .phrase-validate { --letters: 16; --advance: 208px; --delay: -5s; }

    @media (prefers-reduced-motion: no-preference) {
      .sweep { animation: scan 9s linear infinite; }
      .echo { animation: ping 4.5s ease-out infinite; }
      .echo-delayed { animation-delay: -2.25s; }
      .typing { display: inline; }
      .typing-static { display: none; }
      .typing-mask { animation: reveal 15s var(--delay) linear infinite; }
      .typing-cursor {
        animation: cursor-position 15s var(--delay) linear infinite,
                   cursor-visibility 15s var(--delay) step-end infinite;
      }
    }

    @keyframes scan { to { transform: rotate(325deg); } }
    @keyframes ping {
      0%, 18% { opacity: .65; transform: scale(.5); }
      65%, 100% { opacity: 0; transform: scale(1.65); }
    }
    @keyframes reveal {
      0% { width: 0; animation-timing-function: steps(var(--letters)); }
      13%, 24% { width: var(--advance); }
      24% { animation-timing-function: steps(var(--letters)); }
      32%, 100% { width: 0; }
    }
    @keyframes cursor-position {
      0% { transform: translateX(0); animation-timing-function: steps(var(--letters)); }
      13%, 24% { transform: translateX(var(--advance)); }
      24% { animation-timing-function: steps(var(--letters)); }
      32%, 100% { transform: translateX(0); }
    }
    @keyframes cursor-visibility {
      0%, 17%, 22%, 31% { opacity: 1; }
      15%, 20%, 33.333333%, 100% { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="frame"><rect x="1" y="1" width="1118" height="430" rx="23"/></clipPath>
    <clipPath id="type-scope"><rect class="typing-mask phrase-scope" x="76" y="375" width="0" height="40"/></clipPath>
    <clipPath id="type-trace"><rect class="typing-mask phrase-trace" x="76" y="375" width="0" height="40"/></clipPath>
    <clipPath id="type-validate"><rect class="typing-mask phrase-validate" x="76" y="375" width="0" height="40"/></clipPath>
    <radialGradient id="glow" cx="83%" cy="56%" r="62%">
      <stop stop-color="var(--field)"/>
      <stop offset="1" stop-color="var(--surface)"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="0" y1="1" y2="0">
      <stop stop-color="var(--accent)" stop-opacity="0"/>
      <stop offset="1" stop-color="var(--accent)" stop-opacity=".32"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="var(--border)" stroke-opacity=".42"/>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1120" height="432" fill="var(--surface)"/>
    <rect x="600" y="52" width="520" height="304" fill="url(#glow)"/>
    <rect x="703" y="52" width="417" height="304" fill="url(#grid)"/>
    <rect width="1120" height="52" fill="var(--chrome)"/>
    <path d="M0 52H1120 M703 52V356" stroke="var(--border)"/>

    <g class="mono" font-size="18" fill="var(--muted)">
      <circle cx="30" cy="26" r="4" fill="var(--accent)"/>
      <circle cx="46" cy="26" r="4" fill="var(--border)"/>
      <circle cx="62" cy="26" r="4" fill="var(--border)"/>
      <text x="86" y="32"><tspan fill="var(--accent)">$</tspan> whoami</text>
      <text x="1086" y="32" text-anchor="end">github.com/HardCore007</text>
    </g>

    <g class="mono">
      <path d="M42 115H70" stroke="var(--accent)" stroke-width="2"/>
      <text x="83" y="121" font-size="18" font-weight="700" letter-spacing="3" fill="var(--accent)">OFFENSIVE SECURITY</text>
      <text x="44" y="244" font-size="25" fill="var(--muted)">Security Researcher · Red Team Operator</text>
    </g>
    <text x="39" y="202" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="700" letter-spacing="-4" fill="var(--ink)">Umar Mushtaq</text>

    <g fill="var(--chrome)" stroke="var(--border)">
      <rect x="43" y="280" width="121" height="34" rx="6"/>
      <rect x="174" y="280" width="191" height="34" rx="6"/>
      <rect x="375" y="280" width="220" height="34" rx="6"/>
    </g>
    <g class="mono" fill="var(--muted)" font-size="15" font-weight="700" text-anchor="middle">
      <text x="104" y="302">WEB / API</text>
      <text x="269" y="302">ACTIVE DIRECTORY</text>
      <text x="485" y="302">ADVERSARY EMULATION</text>
    </g>

    <g fill="none" stroke="var(--border)">
      <path d="M735 104V80H759 M1063 80H1087V104 M735 292V316H759 M1063 316H1087V292"/>
      <circle cx="912" cy="198" r="103"/>
      <circle cx="912" cy="198" r="72"/>
      <circle cx="912" cy="198" r="41"/>
      <path d="M912 84V312 M798 198H1026" stroke-dasharray="3 5"/>
    </g>
    <g class="sweep">
      <path d="M912 198H1015A103 103 0 0 1 995 259Z" fill="url(#beam)"/>
      <path d="M912 198H1015" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g fill="none" stroke="var(--echo)">
      <circle class="echo" cx="966" cy="151" r="13"/>
      <circle class="echo echo-delayed" cx="864" cy="244" r="12"/>
    </g>
    <circle cx="966" cy="151" r="4" fill="var(--echo)"/>
    <circle cx="864" cy="244" r="3.5" fill="var(--echo)"/>
    <circle cx="912" cy="198" r="4" fill="var(--accent)"/>

    <rect x="0" y="356" width="1120" height="76" fill="var(--chrome)"/>
    <path d="M0 356H1120" stroke="var(--border)"/>
    <g class="mono" font-size="22">
      <text x="44" y="403" fill="var(--accent)">❯</text>
      <text class="typing-static" x="76" y="403" fill="var(--ink)">map the attack surface</text>
      <g class="typing" fill="var(--ink)">
        <text x="76" y="403" textLength="285" lengthAdjust="spacingAndGlyphs" clip-path="url(#type-scope)">map the attack surface</text>
        <text x="76" y="403" textLength="272" lengthAdjust="spacingAndGlyphs" clip-path="url(#type-trace)">trace the attack path</text>
        <text x="76" y="403" textLength="207" lengthAdjust="spacingAndGlyphs" clip-path="url(#type-validate)">validate the fix</text>
        <rect class="typing-cursor phrase-scope" x="76" y="385" width="3" height="21" rx="1" fill="var(--accent)"/>
        <rect class="typing-cursor phrase-trace" x="76" y="385" width="3" height="21" rx="1" fill="var(--accent)"/>
        <rect class="typing-cursor phrase-validate" x="76" y="385" width="3" height="21" rx="1" fill="var(--accent)"/>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1118" height="430" rx="23" fill="none" stroke="var(--border)" stroke-width="2"/>
</svg>
